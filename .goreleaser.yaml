# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w
      - -X github.com/DryHumour/readerware-to-tellico/cmd.version={{.Version}}
      - -X github.com/DryHumour/readerware-to-tellico/cmd.commit={{.Commit}}
      - -X github.com/DryHumour/readerware-to-tellico/cmd.date={{.Date}}
      - -X github.com/DryHumour/readerware-to-tellico/cmd.builtBy=goreleaser

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: 'UNLICENSE'
      - src: 'README.md'
      - src: 'docs/**'
        strip_parent: false
      - src: 'contrib/example/**'
        strip_parent: false

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^chore\b'
      - '^docs\b'
      - '^test\b'
      - '^Merge (pull request|branch|remote-tracking branch)\b'
      - '^Squashed commit\b'
  # Group regexps are mutually exclusive (a "!" breaking marker is matched
  # only by the first group), so matching order cannot change the result.
  groups:
    - title: "Breaking Changes"
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: "Features"
      regexp: '^feat(\([^)]*\))?:'
      order: 1
    - title: "Bug Fixes"
      regexp: '^fix(\([^)]*\))?:'
      order: 2
    - title: "Performance"
      regexp: '^perf(\([^)]*\))?:'
      order: 3
    - title: "Refactoring"
      regexp: '^refactor(\([^)]*\))?:'
      order: 4
    - title: "Dependencies"
      regexp: '^build\(deps\)'
      order: 5
    - title: "Other"
      order: 999

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
